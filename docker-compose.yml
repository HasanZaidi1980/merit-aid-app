# Run the whole stack locally with: docker compose up --build
# Frontend on http://localhost:8080  (proxies /api to backend)
services:
  backend:
    build: ./backend
    environment:
      - DATA_DIR=/data
    volumes:
      - ./backend/data:/data        # put the 6 IPEDS CSVs here
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

