# Google Cloud Load Balancer via GKE Ingress. Routes / to the frontend and /api to
# the backend.
#
# Yes, `kubernetes.io/ingress.class` is the annotation Kubernetes deprecated in 1.18,
# and no, `ingressClassName: gce` does not work here. Checked on this cluster
# (GKE 1.36.4-gke.2377000, 2026-11-20): `kubectl get ingressclass` returns "No
# resources found". GKE runs its ingress controller on the master and keys off this
# annotation; with `ingressClassName` instead, the Ingress sat for 21 minutes with no
# address and no events at all -- the controller never looked at it. The tell was the
# empty Events list, not an error.
#
# The health checks this Ingress uses are NOT defined here: they come from the
# BackendConfig attached to each Service (/api/health for the backend, / for the
# frontend). That is the fix for the 502 on /api/* -- the default is a probe of `/`
# on a node port, which the backend does not serve.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: merit-aid
  annotations:
    kubernetes.io/ingress.class: "gce"
    # Claim the reserved static address by name instead of taking whatever ephemeral
    # IP the load balancer is handed. Without this, `terraform destroy` followed by
    # `terraform apply` comes back on a different address and every link already
    # shared is dead -- including the one in the README.
    #
    # `global-static-ip-name`, not `regional-static-ip-name`: this Ingress creates a
    # global external Application Load Balancer, so the address it claims has to be a
    # global one (see the google_compute_global_address in deploy/terraform/main.tf).
    # The name here must match that resource's name.
    kubernetes.io/ingress.global-static-ip-name: merit-aid-ip
    # TLS for merit-aid-finder.com. The certificate itself is a ManagedCertificate
    # resource (deploy/k8s/certificate.yaml); this annotation is what makes the load
    # balancer grow an HTTPS target proxy and a second forwarding rule for it.
    networking.gke.io/managed-certificates: merit-aid-cert
    # HTTP stays on, explicitly. The default is already true, but leaving it implicit
    # means one `allow-http: "false"` away from deleting the only path that is proven
    # to work -- and the demo's guaranteed fallback is http://136.81.186.158, which
    # needs no certificate and no DNS. There is deliberately no HTTP-to-HTTPS
    # redirect: a redirect would route the fallback through the thing most likely to
    # not be ready. Add one (a FrontendConfig with redirectToHttps) only after the
    # certificate has been serving for long enough to trust.
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
