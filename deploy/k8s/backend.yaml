apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: REGION-docker.pkg.dev/PROJECT_ID/merit-aid/backend:latest
          ports: [{ containerPort: 8000 }]
          env:
            - name: DATA_DIR
              value: /data
            - name: INDEX_DIR
              value: /index
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: anthropic, key: api-key }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: index, mountPath: /index }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        - name: data
          emptyDir: {}          # or a CSI volume synced from the GCS bucket
        - name: index
          persistentVolumeClaim: { claimName: index-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: index-pvc }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
